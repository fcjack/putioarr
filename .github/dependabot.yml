version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      golang-org:
        patterns:
          - "golang.org/*"
          - "google.golang.org/*"
    labels:
      - dependencies
      - dependabot
      - go
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - dependabot
      - github-actions
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - dependabot
      - docker
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - dependabot
      - docker
    commit-message:
      prefix: chore
